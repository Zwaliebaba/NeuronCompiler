# CI.
#   linux:         builds with both stage-0 compilers, runs the unit tests
#                  (including the llvm-mc encoding differential), the lld-link
#                  link test and the Windows ARM64 compile check. The clang leg
#                  also runs the conformance gates (AGENTS.md §6): check-format
#                  and tidy under the pinned LLVM 18.1.3 (Q-28), and check-tree.
#   windows-arm64: native Windows on Arm (hosted windows-11-arm runner, free for
#                  public repositories): builds the tools with clang, then runs
#                  tests/windows/p0-accept.cmd - link.exe, running both demo
#                  programs, and the RtlVirtualUnwind cross-check - and the unit
#                  tests natively.
name: ci
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld mingw-w64-common clang-format clang-tidy
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test
      - name: Link test
        run: make CC=${{ matrix.cc }} test-link
      - name: Windows ARM64 compile check (mingw-w64 headers)
        if: matrix.cc == 'clang'
        run: make check-windows
      - name: Tree check (R2, R7, R11, enumerator shape, build and test registries)
        run: make CC=${{ matrix.cc }} check-tree
      - name: Format check (clang-format 18.1.3)
        if: matrix.cc == 'clang'
        run: make check-format
      - name: Lint (clang-tidy 18.1.3, host and Windows ARM64)
        if: matrix.cc == 'clang'
        run: make tidy
      - name: Upload phase-0 objects for Windows acceptance
        if: matrix.cc == 'clang'
        uses: actions/upload-artifact@v4
        with:
          name: p0-objects
          path: |
            build/p0/p0_nocrt.obj
            build/p0/p0_crt.obj
            build/p0/p0_nocrt.exe
            build/p0/*.pseudo.c
            build/p0/*.lst

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Phase-0 acceptance (link.exe, run, RtlVirtualUnwind)
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          echo Visual Studio: %VSDIR%
          call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" arm64 || exit /b 1
          rem Prefer clang on PATH; fall back to the clang shipped with Visual Studio.
          where clang >nul 2>nul || set "PATH=%VSDIR%\VC\Tools\Llvm\ARM64\bin;%PATH%"
          clang --version || exit /b 1
          link /? | findstr /c:"Version" 
          call tests\windows\p0-accept.cmd || exit /b 1
      - name: Unit tests (native ARM64)
        shell: cmd
        run: build\ncc-test.exe
      - name: Upload acceptance outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-windows-arm64
          path: build/p0win/
